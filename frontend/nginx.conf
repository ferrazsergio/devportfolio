# SEO/Sharing (RF13/RF14, ver ADR-007 "dynamic rendering"): crawlers de redes
# sociais e busca não executam JavaScript, então não veem tags Open Graph
# inseridas pelo Angular. Requisições desses User-Agents para uma rota de
# portfólio público são encaminhadas para o HTML pré-renderizado do backend;
# usuários reais continuam recebendo a SPA normalmente.
map $http_user_agent $is_seo_bot {
    default 0;
    "~*facebookexternalhit" 1;
    "~*LinkedInBot" 1;
    "~*Twitterbot" 1;
    "~*WhatsApp" 1;
    "~*Slackbot" 1;
    "~*TelegramBot" 1;
    "~*Discordbot" 1;
    "~*Googlebot" 1;
    "~*bingbot" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca pode ficar em cache: é ele que aponta pro bundle JS/CSS
    # com hash do deploy atual. Sem isso, o navegador pode continuar servindo
    # um index.html antigo (apontando pra um bundle antigo) depois de um
    # redeploy, fazendo parecer que uma feature nova "não funciona" quando na
    # verdade o usuário nunca chegou a carregar o código novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundles com hash no nome (ex.: main-AB12CD34.js) mudam de nome a cada
    # build — podem ser cacheados de forma agressiva e permanente.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy para o backend: o Angular chama sempre /api/... (caminho relativo,
    # mesma origem), sem precisar de configuração de CORS nem URL fixa por ambiente.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Rotas de portfólio público (username único no path). Exclui explicitamente
    # as rotas fixas da SPA para não capturar /login, /register nem /admin.
    location ~ "^/(?!login$|register$|admin(?:$|/)|api(?:$|/)|assets(?:$|/))(?<public_username>[a-z0-9-]{3,50})$" {
        if ($is_seo_bot) {
            proxy_pass http://backend:8080/api/v1/public/$public_username/meta;
            break;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
