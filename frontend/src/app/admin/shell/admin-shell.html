<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <app-logo />
    </div>

    <a routerLink="/admin" class="sidebar__cta">Publicar portfólio</a>

    <nav class="sidebar__nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.4" />
          <rect x="11" y="2.5" width="6.5" height="6.5" rx="1.4" />
          <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.4" />
          <rect x="11" y="11" width="6.5" height="6.5" rx="1.4" />
        </svg>
        Início
      </a>

      <span class="sidebar__section">Portfólio</span>

      <a routerLink="/admin/profile" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="10" cy="6.5" r="3.2" />
          <path d="M3.5 17c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6" stroke-linecap="round" />
        </svg>
        Perfil
      </a>
      <a routerLink="/admin/experiences" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="6.5" width="15" height="10" rx="1.6" />
          <path d="M7 6.5V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5" stroke-linecap="round" />
        </svg>
        Experiências
      </a>
      <a routerLink="/admin/projects" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path
            d="M2.5 5.8c0-.7.6-1.3 1.3-1.3H8l1.5 2h6.7c.7 0 1.3.6 1.3 1.3v6.9c0 .7-.6 1.3-1.3 1.3H3.8c-.7 0-1.3-.6-1.3-1.3z"
            stroke-linejoin="round"
          />
        </svg>
        Projetos
      </a>
      <a routerLink="/admin/skills" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M10 2.8 12.2 7.6 17.4 8.3 13.6 11.9 14.6 17.1 10 14.5 5.4 17.1 6.4 11.9 2.6 8.3 7.8 7.6Z" stroke-linejoin="round" />
        </svg>
        Habilidades
      </a>
      <a routerLink="/admin/education" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M2 7.5 10 3.5l8 4-8 4-8-4Z" stroke-linejoin="round" />
          <path d="M5.5 9.5v3.8c0 1 2 2.2 4.5 2.2s4.5-1.2 4.5-2.2V9.5" stroke-linecap="round" />
        </svg>
        Formação
      </a>
      <a routerLink="/admin/certifications" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="10" cy="7.5" r="4.5" />
          <path d="M7.3 11.3 6.5 17l3.5-2 3.5 2-.8-5.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Certificações
      </a>
      <a routerLink="/admin/social-links" routerLinkActive="active">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M8.2 11.8 11.8 8.2" stroke-linecap="round" />
          <path
            d="M9 6.2 10.4 4.8a3 3 0 0 1 4.2 4.2L13.2 10.4M11 13.8 9.6 15.2a3 3 0 0 1-4.2-4.2l1.4-1.4"
            stroke-linecap="round"
          />
        </svg>
        Links sociais
      </a>
    </nav>
  </aside>

  <div class="shell__main">
    <header class="topbar">
      @if (currentUser(); as user) {
        <span class="topbar__user">{{ user.name }}</span>
      }
      <button type="button" class="btn btn-secondary" (click)="logout()">Sair</button>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
