<button
  type="button"
  class="theme-toggle"
  (click)="onToggleClick()"
  [attr.aria-label]="(themeService.theme() === 'dark' ? 'theme.toggleToLight' : 'theme.toggleToDark') | translate"
  [attr.aria-pressed]="themeService.theme() === 'dark'"
>
  <span class="theme-toggle__icon">
    @if (themeService.theme() === 'dark') {
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="10" cy="10" r="3.6" />
        <path
          d="M10 2.3v2M10 15.7v2M2.3 10h2M15.7 10h2M4.6 4.6l1.4 1.4M14 14l1.4 1.4M4.6 15.4l1.4-1.4M14 6l1.4-1.4"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M16.8 12.4A7 7 0 0 1 7.6 3.2a7 7 0 1 0 9.2 9.2Z" stroke-linejoin="round" />
      </svg>
    }
  </span>
</button>
