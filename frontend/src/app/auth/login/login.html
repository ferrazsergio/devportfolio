<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-card__brand">
      <app-logo [showWordmark]="false" />
    </div>
    <h1>Entrar</h1>

    @if (errorMessage()) {
      <p class="alert alert-danger">{{ errorMessage() }}</p>
    }
    @if (justRegistered() && !errorMessage()) {
      <p class="alert alert-success">Cadastro realizado! Faça login para continuar.</p>
    }

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Senha
      <div class="password-field">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-field__toggle"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke-linejoin="round" />
              <circle cx="10" cy="10" r="2.3" />
              <path d="M3 3l14 14" stroke-linecap="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke-linejoin="round" />
              <circle cx="10" cy="10" r="2.3" />
            </svg>
          }
        </button>
      </div>
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="auth-card__footer">
      Não tem conta? <a routerLink="/register">Cadastre-se</a>
    </p>
  </form>
</div>
