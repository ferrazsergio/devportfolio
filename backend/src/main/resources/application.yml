spring:
  application:
    name: devportfolio-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devportfolio}
    username: ${SPRING_DATASOURCE_USERNAME:devportfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:devportfolio}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:4200}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    # Chave AES-256 (base64) para cifrar o access token do GitHub em repouso — ver ADR-008.
    token-encryption-key: ${APP_TOKEN_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      github:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        # Token revogado/expirado é um problema do dado de UM usuário, não de
        # instabilidade do GitHub — não deve contar para abrir o circuito.
        ignore-exceptions:
          - dev.devportfolio.github.domain.GithubTokenInvalidException
